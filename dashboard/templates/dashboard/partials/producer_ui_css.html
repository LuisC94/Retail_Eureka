{% comment %}Estilos partilhados dos separadores do Producer (Register, Armazéns, Stock).{% endcomment %}
<style>
    .rg { --rg-brand: #0f766e; --rg-text: #0f172a; --rg-muted: #64748b; --rg-faint: #94a3b8; --rg-border: #5fb3a6; --rg-bg: #f8fafc;
          color: var(--rg-text); font-size: 14px; }
    .rg *, .rg *::before, .rg *::after { box-sizing: border-box; }
    .rg-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .rg-title { margin: 0; font-size: 1.35em; font-weight: 700; letter-spacing: -0.01em; }
    .rg-sub { margin: 4px 0 0; color: var(--rg-muted); font-size: 0.95em; }
    .rg-sub b { color: var(--rg-text); font-weight: 600; }

    /* Seletor Novo registo / Consultar registos */
    .rg .rg-seg { display: inline-flex; background: #f1f5f9; border-radius: 10px; padding: 3px; gap: 2px; border: none; margin: 0; }
    .rg .rg-seg .tab-link { border: none; background: transparent; color: var(--rg-muted); padding: 8px 16px; border-radius: 8px;
                            font-weight: 600; font-size: 0.9em; cursor: pointer; box-shadow: none; margin: 0; transform: none; }
    .rg .rg-seg .tab-link:hover { color: var(--rg-text); background: transparent; }
    .rg .rg-seg .tab-link.active { background: #fff; color: var(--rg-text); box-shadow: 0 1px 3px rgba(15,23,42,.12); }

    /* Passos */
    .rg-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
    .rg-step { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 2px solid var(--rg-border); border-radius: 12px;
               background: #fff; cursor: pointer; text-align: left; transition: border-color .15s, box-shadow .15s; font: inherit; color: inherit; }
    .rg-step:hover { border-color: #0f766e; }
    .rg-step.active { border-color: var(--rg-brand); box-shadow: 0 0 0 3px rgba(15,118,110,.12); }
    .rg-step-num { width: 26px; height: 26px; border-radius: 50%; background: #f1f5f9; color: var(--rg-muted); display: inline-flex;
                   align-items: center; justify-content: center; font-weight: 700; font-size: 0.85em; flex-shrink: 0; }
    .rg-step.active .rg-step-num { background: var(--rg-brand); color: #fff; }
    .rg-step strong { display: block; font-size: 0.92em; }
    .rg-step small { display: block; color: var(--rg-faint); font-size: 0.78em; }

    .rg-card { background: #fff; border: 2px solid var(--rg-border); border-radius: 14px; padding: 22px; box-shadow: 0 2px 6px rgba(15,118,110,.10); margin-bottom: 16px; }
    .rg-card-head { margin-bottom: 16px; }
    .rg-card-head h4 { margin: 0; font-size: 1.05em; font-weight: 700; }
    .rg-card-head p { margin: 4px 0 0; color: var(--rg-muted); font-size: 0.9em; }
    .rg-group-title { font-size: 0.78em; font-weight: 700; color: var(--rg-muted); text-transform: uppercase; letter-spacing: .05em; margin: 20px 0 10px; }

    .rg-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 16px; }
    .rg-field label { display: block; font-size: 0.82em; font-weight: 600; color: #334155; margin-bottom: 6px; }
    .rg-field label em { color: #dc2626; font-style: normal; }
    .rg-field input:not([type=checkbox]):not([type=radio]), .rg-field select, .rg-field textarea {
        width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 9px; background: #fff;
        font-size: 0.95em; color: var(--rg-text); outline: none; transition: border-color .15s, box-shadow .15s; margin: 0; }
    .rg-field textarea { min-height: 80px; resize: vertical; }
    .rg-field input:focus, .rg-field select:focus, .rg-field textarea:focus { border-color: var(--rg-brand); box-shadow: 0 0 0 3px rgba(15,118,110,.15); }
    .rg-field select:disabled { background: var(--rg-bg); color: var(--rg-faint); }
    .rg-field small { display: block; color: var(--rg-faint); font-size: 0.78em; margin-top: 4px; }
    .rg-error { color: #b91c1c; font-size: 0.8em; margin-top: 4px; }
    .rg-wide { grid-column: 1 / -1; }

    .rg-optional { margin-top: 18px; border: 2px solid var(--rg-border); border-radius: 12px; background: var(--rg-bg); }
    .rg-optional summary { cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: 0.9em; color: #334155; list-style: none; }
    .rg-optional summary::-webkit-details-marker { display: none; }
    .rg-optional summary::before { content: '+'; display: inline-block; width: 18px; color: var(--rg-brand); font-weight: 700; }
    .rg-optional[open] summary::before { content: '−'; }
    .rg-optional summary span { color: var(--rg-faint); font-weight: 500; margin-left: 6px; }
    .rg-optional .rg-fields { padding: 4px 16px 16px; }

    .rg-actions { display: flex; justify-content: flex-end; margin-top: 20px; }
    .rg-submit { height: 42px; padding: 0 22px; border-radius: 10px; border: 1px solid var(--rg-brand); background: var(--rg-brand); color: #fff;
                 font-weight: 600; font-size: 0.92em; cursor: pointer; transition: filter .15s; }
    .rg-submit:hover { filter: brightness(1.08); }

    .rg-detail { margin-top: 18px; border-top: 1px solid var(--rg-border); padding-top: 18px; }
    .rg-detail h5 { margin: 0 0 12px; font-size: 0.95em; font-weight: 700; }
    .rg-hint { color: var(--rg-muted); font-size: 0.88em; background: var(--rg-bg); border-radius: 10px; padding: 12px 14px; margin-top: 18px; }

    .rg-quality { margin-top: 18px; border: 2px solid var(--rg-border); border-radius: 12px; padding: 14px 16px; }
    .rg-quality-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.9em; }
    .rg-quality-row span:first-child { color: var(--rg-muted); font-weight: 600; }
    .rg-quality-row span:last-child { font-weight: 700; }
    .rg-quality-track { height: 8px; background: #f1f5f9; border-radius: 999px; overflow: hidden; margin-top: 8px; }
    .rg-quality-track div { height: 100%; width: 0; border-radius: 999px; transition: width .3s ease, background .3s ease; }

    /* Consulta */
    .rg-table-card { padding: 0; overflow: hidden; }
    .rg-table-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px 20px; border-bottom: 1px solid var(--rg-border); }
    .rg-table-head h4 { margin: 0; font-size: 1em; font-weight: 700; }
    .rg-count { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; background: #f1f5f9; color: var(--rg-muted); font-size: 0.8em; font-weight: 600; }
    .rg-filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .rg-filters select { height: 34px; padding: 0 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; font-size: 0.85em; color: var(--rg-text); }
    .rg-scroll { overflow-x: auto; }
    .rg-table { width: 100%; border-collapse: collapse; font-size: 0.88em; }
    .rg-table th { text-align: left; font-size: 0.75em; font-weight: 600; color: var(--rg-muted); text-transform: uppercase; letter-spacing: .04em;
                   padding: 10px 20px; background: var(--rg-bg); white-space: nowrap; }
    .rg-table td { padding: 11px 20px; border-top: 1px solid #f1f5f9; color: #334155; white-space: nowrap; }
    .rg-table td.num, .rg-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .rg-table td.strong { color: var(--rg-text); font-weight: 600; }
    .rg-table tr:hover td { background: #fbfdfd; }
    .rg-muted { color: var(--rg-faint); }
    .rg-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; background: #f0fdfa; color: #0f766e; font-size: 0.85em; margin: 1px 2px 1px 0; }
    .rg-score { display: inline-block; min-width: 42px; text-align: center; padding: 2px 8px; border-radius: 999px; font-weight: 700; font-size: 0.85em; }
    .rg-score.ok { background: #ecfdf5; color: #047857; } .rg-score.mid { background: #fffbeb; color: #b45309; } .rg-score.low { background: #fef2f2; color: #b91c1c; }
    .rg-empty { padding: 28px 20px; text-align: center; color: var(--rg-muted); }

    @media (max-width: 900px) { .rg-steps { grid-template-columns: repeat(2, 1fr); } }

    /* ---------- Indicadores (Stock / Armazéns) ---------- */
    .rg-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .rg-kpi { padding: 16px 18px; margin-bottom: 0; }
    .rg-kpi-label { font-size: 0.78em; font-weight: 600; color: var(--rg-muted); text-transform: uppercase; letter-spacing: .04em; }
    .rg-kpi-value { font-size: 1.8em; font-weight: 700; letter-spacing: -0.02em; margin-top: 6px; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .rg-kpi-value small { font-size: 0.45em; font-weight: 600; color: var(--rg-muted); margin-left: 4px; letter-spacing: 0; }
    .rg-kpi-sub { font-size: 0.8em; color: var(--rg-muted); margin-top: 6px; }
    .rg-kpi.accent { border-top: 4px solid var(--rg-brand); }

    /* ---------- Cartões de armazém ---------- */
    .rg-wh-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; margin-bottom: 16px; }
    .rg-wh { margin-bottom: 0; display: flex; flex-direction: column; gap: 12px; }
    .rg-wh-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .rg-wh-top h5 { margin: 0; font-size: 1.05em; font-weight: 700; }
    .rg-wh-top small { color: var(--rg-faint); font-size: 0.8em; }
    .rg-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .rg-chip { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; background: var(--rg-bg); border: 1px solid var(--rg-border);
               color: #334155; font-size: 0.78em; font-weight: 500; }
    .rg-chip.brand { background: #f0fdfa; color: #0f766e; }
    .rg-occ-row { display: flex; justify-content: space-between; font-size: 0.82em; color: var(--rg-muted); }
    .rg-occ-row b { color: var(--rg-text); font-weight: 600; }
    .rg-occ { height: 8px; background: #f1f5f9; border-radius: 999px; overflow: hidden; margin-top: 6px; }
    .rg-occ div { height: 100%; border-radius: 999px; }
    .rg-wh-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid #f1f5f9; padding-top: 12px; }
    .rg-btn-sec { height: 34px; padding: 0 14px; border-radius: 9px; border: 1.5px solid var(--rg-border); background: #fff; color: #0f766e;
                  font-weight: 600; font-size: 0.85em; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .rg-btn-sec:hover { border-color: var(--rg-brand); background: #f0fdfa; }
    .rg-inline-upload { display: flex; align-items: center; gap: 8px; margin: 0; }
    .rg-inline-upload input[type=file] { font-size: 0.78em; max-width: 190px; color: var(--rg-muted); }
    .rg-link-btn { background: none; border: none; color: var(--rg-brand); font-weight: 600; font-size: 0.82em; cursor: pointer; padding: 0; margin-top: 6px; }
    .rg-guide { background: var(--rg-bg); border: 1px solid var(--rg-border); border-radius: 10px; padding: 10px 14px; margin-top: 8px; font-size: 0.8em; color: #334155; line-height: 1.6; }
    .rg-guide ul { margin: 0; padding-left: 16px; }

    /* ---------- Caixas de seleção (sensores) ---------- */
    .rg-checks ul, .rg-checks > div { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
    .rg-checks label { display: flex !important; align-items: center; gap: 8px; font-weight: 500 !important; font-size: 0.88em !important; color: #334155 !important;
                       margin: 0 !important; padding: 8px 10px; border: 1px solid var(--rg-border); border-radius: 9px; background: #fff; cursor: pointer; }
    .rg-checks input[type=checkbox] { accent-color: #0f766e; width: 16px; height: 16px; }
    .rg-sub-box { background: var(--rg-bg); border-radius: 12px; padding: 14px 16px; margin-top: 14px; }

    /* ---------- Ações em tabelas ---------- */
    .rg-actions-cell { display: flex; gap: 6px; justify-content: flex-end; }
    .rg-mini { height: 30px; padding: 0 10px; border-radius: 8px; border: 1.5px solid var(--rg-border); background: #fff; color: #0f766e;
               font-weight: 600; font-size: 0.8em; cursor: pointer; white-space: nowrap; }
    .rg-mini:hover { border-color: var(--rg-brand); background: #f0fdfa; }
    .rg-table tr.is-empty td { color: var(--rg-faint); }

    /* =====================================================================
       Variante "rich" (Armazéns e Stock): contornos e sombras mais marcados
       ===================================================================== */
    .rg.rg-rich { --rg-border: #3f9e90; }
    .rg-rich .rg-card { border: 2px solid var(--rg-border); box-shadow: 0 10px 24px -10px rgba(15,118,110,.45), 0 2px 6px rgba(15,23,42,.08); }

    .rg-hero { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
               background: linear-gradient(120deg, #0f766e 0%, #115e59 55%, #134e4a 100%); color: #fff;
               border-radius: 16px; padding: 22px 26px; margin-bottom: 18px; box-shadow: 0 12px 28px -12px rgba(15,94,89,.7); }
    .rg-hero h3 { margin: 0; font-size: 1.45em; font-weight: 700; letter-spacing: -0.01em; color: #fff; }
    .rg-hero p { margin: 6px 0 0; color: rgba(255,255,255,.82); font-size: 0.95em; }
    .rg-hero p b { color: #fff; }
    .rg-hero-icon { width: 52px; height: 52px; border-radius: 14px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25);
                    display: inline-flex; align-items: center; justify-content: center; font-size: 1.6em; flex-shrink: 0; }
    .rg-hero-main { display: flex; align-items: center; gap: 16px; }

    .rg-rich .rg-kpi { display: flex; gap: 14px; align-items: flex-start; background: linear-gradient(160deg, #ffffff 0%, #f0fdfa 100%); }
    .rg-rich .rg-kpi.accent { border-top: 2px solid var(--rg-border); background: linear-gradient(160deg, #ecfdf5 0%, #ccfbf1 100%); }
    .rg-kpi-icon { width: 42px; height: 42px; border-radius: 12px; background: #0f766e; color: #fff; display: inline-flex; align-items: center;
                   justify-content: center; font-size: 1.15em; flex-shrink: 0; box-shadow: 0 6px 14px -6px rgba(15,118,110,.8); }
    .rg-rich .rg-kpi-value { color: #134e4a; }

    .rg-rich .rg-table-head { background: linear-gradient(180deg, #f0fdfa 0%, #e6f7f3 100%); border-bottom: 2px solid var(--rg-border); }
    .rg-rich .rg-table-head h4 { color: #134e4a; }
    .rg-rich .rg-table th { background: #ecfdf5; color: #0f766e; border-bottom: 1px solid #b7e1da; }
    .rg-rich .rg-table tbody tr:nth-child(even) td { background: #fafdfc; }
    .rg-rich .rg-table tbody tr:hover td { background: #f0fdfa; }
    .rg-rich .rg-count { background: #0f766e; color: #fff; }

    .rg-rich .rg-card-head { display: flex; gap: 12px; align-items: flex-start; padding-bottom: 14px; border-bottom: 1.5px solid #d5ece8; }
    .rg-section-icon { width: 38px; height: 38px; border-radius: 10px; background: #ecfdf5; border: 1.5px solid var(--rg-border); color: #0f766e;
                       display: inline-flex; align-items: center; justify-content: center; font-size: 1.05em; flex-shrink: 0; }
    .rg-section-title { font-size: 1.05em; font-weight: 700; color: #134e4a; margin: 26px 0 12px; display: flex; align-items: center; gap: 10px; }
    .rg-section-title .rg-count { margin-left: 0; }

    .rg-rich .rg-wh { border-top: 6px solid #0f766e; padding-top: 18px; }
    .rg-wh-icon { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, #0f766e, #134e4a); color: #fff;
                  display: inline-flex; align-items: center; justify-content: center; font-size: 1.1em; flex-shrink: 0; }
    .rg-wh-title { display: flex; gap: 12px; align-items: center; }
    .rg-rich .rg-occ { height: 10px; background: #e2f3f0; }
    .rg-rich .rg-chip { background: #fff; border-color: #b7e1da; }
    .rg-rich .rg-chip.brand { background: #0f766e; color: #fff; border-color: #0f766e; }
    .rg-rich .rg-sub-box { background: #f0fdfa; border: 1.5px dashed #9fd1c8; }
    .rg-rich .rg-optional { border: 2px solid var(--rg-border); background: #fff; }
    .rg-rich .rg-optional summary { color: #134e4a; }

    .rg-hero .rg-seg { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); }
    .rg-hero .rg-seg .tab-link { color: rgba(255,255,255,.85); }
    .rg-hero .rg-seg .tab-link:hover { color: #fff; }
    .rg-hero .rg-seg .tab-link.active { background: #fff; color: #134e4a; box-shadow: 0 4px 12px -4px rgba(0,0,0,.35); }
    .rg-rich .rg-step { border: 2px solid var(--rg-border); box-shadow: 0 8px 18px -10px rgba(15,118,110,.45); }
    .rg-rich .rg-step.active { background: linear-gradient(160deg, #ecfdf5 0%, #ccfbf1 100%); border-color: #0f766e; }
    .rg-rich .rg-step-num { background: #ecfdf5; color: #0f766e; border: 1.5px solid var(--rg-border); }
    .rg-rich .rg-step.active .rg-step-num { background: #0f766e; color: #fff; border-color: #0f766e; }
    .rg-rich .rg-step strong { color: #134e4a; }
    .rg-rich .rg-quality { border: 2px solid var(--rg-border); background: #f0fdfa; }
    .rg-rich .rg-detail { border-top: 1.5px dashed #9fd1c8; }
</style>
